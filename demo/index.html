<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flora</title>
<style>
  :root { --bg:#f6f3ec; --fg:#23211c; --mute:#6f6a5f; --line:#ddd6c8; --card:#fffdf8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { padding:16px 20px 0; }
  h1 { margin:0; font-size:22px; }
  h2 { margin:28px 20px 10px; font-size:16px; }
  .lab { display:grid; grid-template-columns:240px 1fr; gap:16px; padding:12px 20px; align-items:start; }
  .ctl { display:grid; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .ctl label { display:grid; grid-template-columns:72px 1fr; align-items:center; gap:8px; color:var(--mute); }
  .ctl input, .ctl select, .ctl button { font:inherit; min-width:0; width:100%; padding:4px 6px; }
  .ctl .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  #info { color:var(--mute); font-size:12px; min-height:18px; }
  .view { overflow:auto; }
  canvas#stage { display:block; box-shadow:0 1px 4px #0002; background:#fff; }
  .doc { margin:0 20px; background:#fdfcf7; border:1px solid var(--line); height:640px; max-width:860px; }
  .doc article { position:absolute; left:320px; top:60px; width:470px; }
  .doc h3 { margin:0 0 8px; font-size:22px; font-family:Georgia,"Batang",serif; }
  .doc p { margin:0 0 12px; line-height:1.75; }
  #explorer { padding:0 20px 24px; max-width:860px; }
  #explorer h3 { margin:14px 0 6px; font-size:13px; color:var(--mute); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:14px; }
  .row figure { margin:0; width:104px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 4px 6px; }
  .row img { display:block; margin:0 auto; }
  .row figcaption { font-size:12px; overflow-wrap:anywhere; }
  @media (max-width:760px) { .lab { grid-template-columns:1fr; } .doc article { left:24px; width:auto; right:24px; } }
</style>
</head>
<body>
<header><h1>flora</h1></header>
<section class="lab">
  <div class="ctl">
    <label>시드 <input id="seed" value="7"></label>
    <label>스타일 <select id="style"></select></label>
    <label>공간 <select id="composition"></select></label>
    <label>재질 <select id="material"></select></label>
    <label>색 <select id="palette"></select></label>
    <label>바탕 <select id="surface"></select></label>
    <label>꽃 <select id="flower"></select></label>
    <label>가로 <input id="w" type="number" value="640" min="40" max="2000"></label>
    <label>세로 <input id="h" type="number" value="760" min="40" max="2000"></label>
    <label>밀도 <input id="density" type="range" min="0.2" max="1.3" step="0.05" value="0.85"></label>
    <label>새 품종 <input id="invent" type="checkbox" style="width:auto;justify-self:start"></label>
    <div class="btns"><button id="shuffle">다른 시드</button><button id="grow">자라기</button><button id="save">SVG 저장</button></div>
    <div id="info"></div>
  </div>
  <div class="view"><canvas id="stage"></canvas></div>
</section>

<h2>문서: 본문을 피해 여백에서 자라기</h2>
<flora-art class="doc" seed="docs/intro.md" flora-style="delft" composition="panel">
  <article data-flora-keep="lines">
    <h3>문서에 피어나는 꽃</h3>
    <p>이 문단은 data-flora-keep="lines" 표시가 된 영역입니다. 라이브러리는 줄마다 글자 폭을 재서 그 바깥 공간을 채웁니다.</p>
    <p>짧은 줄이 이어지면<br>그 옆의 빈자리로<br>꽃과 잎이<br>들어옵니다.<br>시를 쓴 문서라면<br>더 잘 어울립니다.</p>
    <p>시드를 문서 경로로 주면 문서마다 자기 정원을 갖고, 다시 열어도 항상 같은 모습입니다.</p>
  </article>
</flora-art>

<h2>탐색기: 경로마다 고유한 엠블럼</h2>
<div id="explorer"></div>
<script src="app.js"></script>
</body>
</html>
